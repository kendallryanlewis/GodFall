name: Publish GodFall item list
on:
  push:
    branches: [main]
    paths:
      - 'GameItems/**'
      - '!GameItems/manifest.json'
      - 'scripts/build_manifest.py'
      - '.github/workflows/publish-items.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godfall-items-main
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packs and build the current list
        run: python3 scripts/build_manifest.py --source-commit "$GITHUB_SHA"
      - name: Publish the list
        shell: bash
        run: |
          git add -- GameItems/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update GodFall item list'
          git push origin HEAD:main
